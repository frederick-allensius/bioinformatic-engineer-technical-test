name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov --cov-report=term-missing

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suite inside the image
        run: |
          docker build --target test -t dna-analysis-api:test .
          docker run --rm dna-analysis-api:test
      - name: Build and smoke-test the runtime image
        run: |
          docker build -t dna-analysis-api .
          docker run -d --name api -p 8000:8000 dna-analysis-api
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/api/health && break; sleep 1; done
          curl -fsS -X POST http://localhost:8000/api/align -F "file=@samples/patient_02.fasta"
          docker rm -f api
